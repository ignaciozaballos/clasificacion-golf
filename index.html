<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga de hándicap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F1E6;
    --cream-line: #E4DDC9;
    --ink: #21261F;
    --ink-soft: #5C6459;
    --fairway: #1F3A2E;
    --fairway-soft: #4A6656;
    --up: #2F6B3A;
    --up-bg: #E4EFE2;
    --down: #A83C34;
    --down-bg: #F4E4E1;
    --same: #A9791F;
    --same-bg: #F2E9D4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--fairway);
    padding-bottom: 1.25rem;
    margin-bottom: 0.25rem;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    margin: 0;
    color: var(--fairway);
    letter-spacing: -0.01em;
  }

  .updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.5;
  }

  .col-heads {
    display: grid;
    grid-template-columns: 32px 1fr 70px 60px 88px;
    gap: 12px;
    padding: 0.75rem 0.25rem 0.5rem;
    font-size: 12px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--cream-line);
  }

  .col-heads span:nth-child(3),
  .col-heads span:nth-child(4),
  .col-heads span:nth-child(5) {
    text-align: right;
  }

  ol.board {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 32px 1fr 70px 60px 88px;
    gap: 12px;
    align-items: center;
    padding: 0.85rem 0.25rem;
    border-bottom: 1px solid var(--cream-line);
  }

  .row.you {
    background: rgba(31, 58, 46, 0.05);
    margin: 0 -0.25rem;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    border-radius: 6px;
  }

  .rank {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--fairway-soft);
  }

  .name {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }

  .status-line {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .handicap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    text-align: right;
    font-weight: 500;
  }

  .trend {
    display: flex;
    justify-content: flex-end;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 500;
  }

  .pill.up { background: var(--up-bg); color: var(--up); }
  .pill.down { background: var(--down-bg); color: var(--down); }
  .pill.same { background: var(--same-bg); color: var(--same); }
  .pill.new { background: var(--cream-line); color: var(--ink-soft); }

  .mod {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: right;
    color: var(--ink-soft);
  }

  .legend {
    display: flex;
    gap: 1.5rem;
    margin-top: 1.75rem;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .legend span { display: flex; align-items: center; gap: 6px; }

  .legend .pill { width: 18px; height: 18px; font-size: 10px; }

  .state {
    padding: 3rem 0.25rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .error-box {
    background: var(--down-bg);
    color: var(--down);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    font-size: 13px;
    margin-top: 1rem;
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <h1>Liga de hándicap</h1>
    <div class="updated" id="updated">cargando…</div>
  </div>

  <div class="col-heads">
    <span>#</span>
    <span>Jugador</span>
    <span>Hcp</span>
    <span></span>
    <span>Modif.</span>
  </div>

  <ol class="board" id="board"></ol>

  <div id="state-area"></div>

  <div class="legend">
    <span><span class="pill up">▲</span> Ha adelantado a alguien</span>
    <span><span class="pill down">▼</span> Le han adelantado</span>
    <span><span class="pill same">=</span> Mantiene posición</span>
  </div>

</div>

<script>
  // ----------------------------------------------------------------
  // Sustituye esta URL por la de tu propio repositorio de GitHub una
  // vez lo hayas creado y el Action haya corrido al menos una vez:
  //   https://raw.githubusercontent.com/TU-USUARIO/TU-REPO/main/data/latest.json
  // ----------------------------------------------------------------
  const CONFIG = {
    DATA_URL: "https://raw.githubusercontent.com/TU-USUARIO/TU-REPO/main/data/latest.json",
    // Si quieres resaltar tu propia fila, pon aquí tu "id" de friends.json
    YOU_ID: "ignacio"
  };

  const board = document.getElementById('board');
  const updatedEl = document.getElementById('updated');
  const stateArea = document.getElementById('state-area');

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function fmtTimestamp(iso) {
    if (!iso) return '';
    const dt = new Date(iso);
    return dt.toLocaleString('es-ES', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function trendPill(trend) {
    if (trend === 'up') return { cls: 'up', glyph: '▲' };
    if (trend === 'down') return { cls: 'down', glyph: '▼' };
    if (trend === 'new') return { cls: 'new', glyph: '•' };
    return { cls: 'same', glyph: '=' };
  }

  function render(snapshot) {
    updatedEl.textContent = 'Actualizado ' + fmtTimestamp(snapshot.generated_at);
    board.innerHTML = '';

    const players = snapshot.players || [];
    if (players.length === 0) {
      stateArea.innerHTML = '<div class="state">Todavía no hay datos. En cuanto el Action se ejecute por primera vez aparecerán aquí.</div>';
      return;
    }
    stateArea.innerHTML = '';

    for (const p of players) {
      const li = document.createElement('li');
      li.className = 'row' + (p.id === CONFIG.YOU_ID ? ' you' : '');

      const errorNote = p.error
        ? `<div class="status-line" style="color: var(--down);">${p.error}</div>`
        : (p.estado && p.estado.toLowerCase() !== 'válido'
            ? `<div class="status-line">${p.estado}</div>`
            : '');

      const t = trendPill(p.trend);

      li.innerHTML = `
        <div class="rank">${p.rank ?? '–'}</div>
        <div>
          <div class="name">${p.nombre ?? '(sin datos)'}</div>
          ${errorNote}
        </div>
        <div class="handicap">${p.handicap_display ?? '—'}</div>
        <div class="trend"><span class="pill ${t.cls}" title="${p.trend}">${t.glyph}</span></div>
        <div class="mod">${fmtDate(p.ultima_modificacion)}</div>
      `;
      board.appendChild(li);
    }
  }

  async function load() {
    try {
      const res = await fetch(CONFIG.DATA_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const snapshot = await res.json();
      render(snapshot);
    } catch (err) {
      updatedEl.textContent = '';
      stateArea.innerHTML = `<div class="error-box">
        No se pudo cargar el ranking (${err.message}).<br>
        Comprueba que CONFIG.DATA_URL apunta a tu archivo data/latest.json en GitHub
        y que el repositorio es público.
      </div>`;
    }
  }

  load();
</script>
</body>
</html>
