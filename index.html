<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga de hándicap</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon-trophy.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16A34A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF4F0;
    --panel: #FFFFFF;
    --panel-2: #F5F9F6;
    --line: #E3EAE4;
    --line-soft: #EDF2EE;
    --text: #16241C;
    --muted: #64766B;
    --muted-2: #97A79D;
    --primary: #16A34A;
    --primary-2: #0D7D39;
    --gold: #D4AF37;
    --gold-2: #A3831F;
    --silver: #9AA3AD;
    --silver-2: #707882;
    --bronze: #BD7B45;
    --bronze-2: #8F5A2C;
    --bad: #E0483C;
    --good: #16A34A;
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }

  header.hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
    border-radius: var(--radius);
    padding: 20px 22px;
    color: #fff;
    margin-bottom: 14px;
    box-shadow: 0 10px 30px rgba(22, 163, 74, .25);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  header.hero .hero-icon { flex-shrink: 0; }
  header.hero h1 { margin: 0 0 4px; font-size: 21px; font-weight: 800; letter-spacing: .2px; }
  header.hero .sub { font-size: 12.5px; opacity: .85; font-weight: 600; }

  .filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .filter-tabs button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 15px;
    border-radius: 999px;
    cursor: pointer;
  }

  .filter-tabs button:hover { border-color: var(--muted-2); }

  .filter-tabs button[data-active="true"] {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 10px rgba(22, 163, 74, .25);
  }

  .col-heads {
    display: grid;
    grid-template-columns: 24px minmax(100px, 1fr) 88px 50px 28px 78px;
    gap: 8px;
    min-width: 440px;
    padding: 0 16px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted-2);
    letter-spacing: .03em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .col-heads span:nth-child(4),
  .col-heads span:nth-child(6) { text-align: right; }
  .col-heads span:nth-child(5) { text-align: center; }

  .board-wrap { overflow-x: auto; }

  ol.board {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 440px;
  }

  .row {
    display: grid;
    grid-template-columns: 24px minmax(100px, 1fr) 88px 50px 28px 78px;
    gap: 8px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(20, 30, 24, .04);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .12s ease;
  }

  .row:hover,
  .row.selected {
    transform: scale(1.015);
    box-shadow: 0 10px 22px rgba(20, 30, 24, .14);
  }

  .row.you { outline: 2px solid var(--primary); outline-offset: 1px; }

  .row.rank-1 {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
    border: none;
    box-shadow: 0 10px 24px rgba(163, 131, 31, .32);
    --row-ink: #fff;
    --row-sub: rgba(255, 255, 255, .82);
  }
  .row.rank-2 {
    background: linear-gradient(135deg, var(--silver) 0%, var(--silver-2) 100%);
    border: none;
    box-shadow: 0 10px 24px rgba(112, 120, 130, .28);
    --row-ink: #fff;
    --row-sub: rgba(255, 255, 255, .82);
  }
  .row.rank-3 {
    background: linear-gradient(135deg, var(--bronze) 0%, var(--bronze-2) 100%);
    border: none;
    box-shadow: 0 10px 24px rgba(143, 90, 44, .3);
    --row-ink: #fff;
    --row-sub: rgba(255, 255, 255, .82);
  }
  .row.rank-4,
  .row.rank-5 {
    background: var(--panel-2);
  }

  .rank {
    font-size: 15px;
    font-weight: 800;
    color: var(--row-ink, var(--muted-2));
  }

  .name {
    font-size: 14px;
    font-weight: 700;
    color: var(--row-ink, var(--text));
  }

  .status-line {
    font-size: 11px;
    font-weight: 600;
    color: var(--row-sub, var(--muted));
    margin-top: 1px;
  }

  .licencia {
    font-size: 11px;
    font-weight: 600;
    color: var(--row-sub, var(--muted-2));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .handicap {
    font-size: 18px;
    font-weight: 800;
    text-align: right;
    color: var(--row-ink, var(--text));
  }

  .trend { display: flex; justify-content: center; }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 800;
    background: #fff;
    box-shadow: 0 1px 4px rgba(20, 30, 24, .18);
  }

  .pill.up { color: var(--good); }
  .pill.down { color: var(--bad); }
  .pill.same { color: var(--gold-2); }
  .pill.new { color: var(--muted-2); }

  .mod {
    font-size: 11px;
    font-weight: 700;
    text-align: right;
    color: var(--row-sub, var(--muted-2));
    white-space: nowrap;
  }

  .legend {
    display: flex;
    gap: 14px;
    margin: 16px 4px 0;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 700;
    flex-wrap: wrap;
  }

  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend .pill { width: 18px; height: 18px; font-size: 10px; box-shadow: 0 1px 3px rgba(20, 30, 24, .15); }

  .state {
    padding: 3rem .25rem;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .error-box {
    background: rgba(224, 72, 60, .12);
    border: 1px solid rgba(224, 72, 60, .35);
    color: var(--bad);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <svg class="hero-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3.5h8v3.5a4 4 0 0 1-8 0V3.5z"/>
      <path d="M8 4.5H5.2a1 1 0 0 0-1 1v.8a3 3 0 0 0 3 3"/>
      <path d="M16 4.5h2.8a1 1 0 0 1 1 1v.8a3 3 0 0 1-3 3"/>
      <line x1="12" y1="11" x2="12" y2="15"/>
      <line x1="9" y1="19.5" x2="15" y2="19.5"/>
      <line x1="9" y1="19.5" x2="9" y2="16"/>
      <line x1="15" y1="19.5" x2="15" y2="16"/>
    </svg>
    <div>
      <h1>Clasificación</h1>
      <div class="sub" id="updated">cargando…</div>
    </div>
  </header>

  <div class="filter-tabs">
    <button type="button" id="btn-top10" data-active="false">Top 10</button>
    <button type="button" id="btn-recent" data-active="false">Act. últ. 180 d.</button>
  </div>

  <div class="col-heads">
    <span>#</span>
    <span>Jugador</span>
    <span>Licencia</span>
    <span>Hcp</span>
    <span></span>
    <span>Últ. act.</span>
  </div>

  <div class="board-wrap">
    <ol class="board" id="board"></ol>
  </div>

  <div id="state-area"></div>

  <div class="legend">
    <span><span class="pill up">▲</span> Ha adelantado a alguien</span>
    <span><span class="pill down">▼</span> Le han adelantado</span>
    <span><span class="pill same">=</span> Mantiene posición</span>
  </div>

</div>

<script>
  // ----------------------------------------------------------------
  // Sustituye esta URL por la de tu propio repositorio de GitHub una
  // vez lo hayas creado y el Action haya corrido al menos una vez:
  //   https://raw.githubusercontent.com/ignaciozaballos/clasificacion-golf/main/data/latest.json
  // ----------------------------------------------------------------
  const CONFIG = {
    DATA_URL: "https://raw.githubusercontent.com/ignaciozaballos/clasificacion-golf/main/data/latest.json",
    // Si quieres resaltar tu propia fila, pon aquí tu "id" de friends.json
    YOU_ID: "ignacio"
  };

  const board = document.getElementById('board');
  const updatedEl = document.getElementById('updated');
  const stateArea = document.getElementById('state-area');

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function daysSince(iso) {
    if (!iso) return null;
    const then = new Date(iso + 'T00:00:00');
    const now = new Date();
    return Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
  }

  function fmtDaysAgo(iso) {
    const days = daysSince(iso);
    if (days === null) return '—';
    if (days === 0) return 'Hoy';
    if (days === 1) return 'Ayer';
    return `Hace ${days} d.`;
  }

  function fmtTimestamp(iso) {
    if (!iso) return '';
    const dt = new Date(iso);
    return dt.toLocaleString('es-ES', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function trendPill(trend) {
    if (trend === 'up') return { cls: 'up', glyph: '▲' };
    if (trend === 'down') return { cls: 'down', glyph: '▼' };
    if (trend === 'new') return { cls: 'new', glyph: '•' };
    return { cls: 'same', glyph: '=' };
  }

  const filterState = { top10: false, recent: false };
  let currentSnapshot = null;

  function applyFilters(players) {
    let out = players;
    if (filterState.recent) {
      out = out.filter(p => {
        const days = daysSince(p.ultima_modificacion);
        return days !== null && days <= 180;
      });
    }
    if (filterState.top10) {
      out = out.slice(0, 10);
    }
    return out;
  }

  function renderRows(players) {
    board.innerHTML = '';

    if (players.length === 0) {
      stateArea.innerHTML = '<div class="state">Nadie cumple estos filtros ahora mismo.</div>';
      return;
    }
    stateArea.innerHTML = '';

    for (const p of players) {
      const li = document.createElement('li');
      const rankClass = (p.rank && p.rank <= 5) ? ` rank-${p.rank}` : '';
      li.className = 'row' + rankClass + (p.id === CONFIG.YOU_ID ? ' you' : '');

      const errorNote = p.error
        ? `<div class="status-line" style="color:#fff;">${p.error}</div>`
        : (p.estado && p.estado.toLowerCase() !== 'válido'
            ? `<div class="status-line">${p.estado}</div>`
            : '');

      const t = trendPill(p.trend);

      li.innerHTML = `
        <div class="rank num">${p.rank ?? '–'}</div>
        <div>
          <div class="name">${p.nombre ?? '(sin datos)'}</div>
          ${errorNote}
        </div>
        <div class="licencia num">${p.licencia ?? '—'}</div>
        <div class="handicap num">${p.handicap_display ?? '—'}</div>
        <div class="trend"><span class="pill ${t.cls}" title="${p.trend}">${t.glyph}</span></div>
        <div class="mod num" title="${fmtDate(p.ultima_modificacion)}">${fmtDaysAgo(p.ultima_modificacion)}</div>
      `;
      board.appendChild(li);
    }
  }

  board.addEventListener('click', function (e) {
    const row = e.target.closest('.row');
    if (!row) return;
    const wasSelected = row.classList.contains('selected');
    board.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'));
    if (!wasSelected) row.classList.add('selected');
  });

  function render(snapshot) {
    currentSnapshot = snapshot;
    updatedEl.textContent = 'Actualizado ' + fmtTimestamp(snapshot.generated_at);

    const players = snapshot.players || [];
    if (players.length === 0) {
      stateArea.innerHTML = '<div class="state">Todavía no hay datos. En cuanto el Action se ejecute por primera vez aparecerán aquí.</div>';
      board.innerHTML = '';
      return;
    }

    renderRows(applyFilters(players));
  }

  document.getElementById('btn-top10').addEventListener('click', function () {
    filterState.top10 = !filterState.top10;
    this.dataset.active = String(filterState.top10);
    if (currentSnapshot) renderRows(applyFilters(currentSnapshot.players || []));
  });

  document.getElementById('btn-recent').addEventListener('click', function () {
    filterState.recent = !filterState.recent;
    this.dataset.active = String(filterState.recent);
    if (currentSnapshot) renderRows(applyFilters(currentSnapshot.players || []));
  });

  async function load() {
    try {
      const res = await fetch(CONFIG.DATA_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const snapshot = await res.json();
      render(snapshot);
    } catch (err) {
      updatedEl.textContent = '';
      stateArea.innerHTML = `<div class="error-box">
        No se pudo cargar el ranking (${err.message}).<br>
        Comprueba que CONFIG.DATA_URL apunta a tu archivo data/latest.json en GitHub
        y que el repositorio es público.
      </div>`;
    }
  }

  load();
</script>
</body>
</html>
