<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liga de hándicap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F1E6;
    --cream-line: #E4DDC9;
    --ink: #21261F;
    --ink-soft: #5C6459;
    --fairway: #1F3A2E;
    --fairway-soft: #4A6656;
    --up: #2F6B3A;
    --up-bg: #E4EFE2;
    --down: #A83C34;
    --down-bg: #F4E4E1;
    --same: #A9791F;
    --same-bg: #F2E9D4;
    --gold-bg: #E7C766;
    --gold-ink: #4A3600;
    --silver-bg: #D9DBD3;
    --silver-ink: #33362F;
    --bronze-bg: #D6A06A;
    --bronze-ink: #432808;
    --top5-bg: #EFE7C9;
    --top5-ink: #3B3620;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--fairway);
    padding-bottom: 1.25rem;
    margin-bottom: 0.25rem;
    gap: 1rem;
    flex-wrap: wrap;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    color: var(--fairway);
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .title-icon {
    flex-shrink: 0;
    color: var(--fairway);
  }

  .updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.5;
  }

  .board-wrap {
    overflow-x: auto;
  }

  .col-heads {
    display: grid;
    grid-template-columns: 28px minmax(130px, 1fr) 100px 54px 30px 78px;
    gap: 10px;
    min-width: 480px;
    padding: 0.75rem 0.25rem 0.5rem;
    font-size: 12px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--cream-line);
  }

  .col-heads span:nth-child(4),
  .col-heads span:nth-child(6) {
    text-align: right;
  }

  .col-heads span:nth-child(5) {
    text-align: center;
  }

  ol.board {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 28px minmax(130px, 1fr) 100px 54px 30px 78px;
    gap: 10px;
    min-width: 480px;
    align-items: center;
    padding: 0.85rem 0.25rem;
    border-bottom: 1px solid var(--cream-line);
  }

  .row.you {
    box-shadow: inset 4px 0 0 var(--fairway);
    padding-left: calc(0.25rem + 6px);
  }

  .row.rank-1,
  .row.rank-2,
  .row.rank-3,
  .row.rank-4,
  .row.rank-5 {
    margin: 2px -0.5rem;
    padding-left: 0.75rem;
    padding-right: 0.75rem;
    border-bottom: none;
    border-radius: 6px;
  }

  .row.rank-1 { background: var(--gold-bg); --row-ink: var(--gold-ink); }
  .row.rank-2 { background: var(--silver-bg); --row-ink: var(--silver-ink); }
  .row.rank-3 { background: var(--bronze-bg); --row-ink: var(--bronze-ink); }
  .row.rank-4,
  .row.rank-5 { background: var(--top5-bg); --row-ink: var(--top5-ink); }

  .row.rank-1.you,
  .row.rank-2.you,
  .row.rank-3.you,
  .row.rank-4.you,
  .row.rank-5.you {
    padding-left: calc(0.75rem + 6px);
  }

  .rank {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--row-ink, var(--fairway-soft));
  }

  .name {
    font-size: 15px;
    font-weight: 500;
    color: var(--row-ink, var(--ink));
  }

  .status-line {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .licencia {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--row-ink, var(--ink-soft));
  }

  .handicap {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    text-align: right;
    font-weight: 500;
    color: var(--row-ink, var(--ink));
  }

  .trend {
    display: flex;
    justify-content: flex-end;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 500;
  }

  .pill.up { background: var(--up-bg); color: var(--up); }
  .pill.down { background: var(--down-bg); color: var(--down); }
  .pill.same { background: var(--same-bg); color: var(--same); }
  .pill.new { background: var(--cream-line); color: var(--ink-soft); }

  .mod {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: right;
    color: var(--row-ink, var(--ink-soft));
  }

  .legend {
    display: flex;
    gap: 1.5rem;
    margin-top: 1.75rem;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .legend span { display: flex; align-items: center; gap: 6px; }

  .legend .pill { width: 18px; height: 18px; font-size: 10px; }

  .state {
    padding: 3rem 0.25rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .error-box {
    background: var(--down-bg);
    color: var(--down);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    font-size: 13px;
    margin-top: 1rem;
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <h1 class="title">
      <svg class="title-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3.5h8v3.5a4 4 0 0 1-8 0V3.5z"/>
        <path d="M8 4.5H5.2a1 1 0 0 0-1 1v.8a3 3 0 0 0 3 3"/>
        <path d="M16 4.5h2.8a1 1 0 0 1 1 1v.8a3 3 0 0 1-3 3"/>
        <line x1="12" y1="11" x2="12" y2="15"/>
        <line x1="9" y1="19.5" x2="15" y2="19.5"/>
        <line x1="9" y1="19.5" x2="9" y2="16"/>
        <line x1="15" y1="19.5" x2="15" y2="16"/>
      </svg>
      <span>LIGA DE HÁNDICAP</span>
      <svg class="title-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="6" y1="2.5" x2="6" y2="21"/>
        <path d="M6 4l10.5 3.2L6 10.4"/>
        <circle cx="17.5" cy="19" r="1.7" fill="currentColor" stroke="none"/>
      </svg>
    </h1>
    <div class="updated" id="updated">cargando…</div>
  </div>

  <div class="board-wrap">
    <div class="col-heads">
      <span>#</span>
      <span>Jugador</span>
      <span>Licencia</span>
      <span>Hcp</span>
      <span></span>
      <span>Últ. act.</span>
    </div>

    <ol class="board" id="board"></ol>
  </div>

  <div id="state-area"></div>

  <div class="legend">
    <span><span class="pill up">▲</span> Ha adelantado a alguien</span>
    <span><span class="pill down">▼</span> Le han adelantado</span>
    <span><span class="pill same">=</span> Mantiene posición</span>
  </div>

</div>

<script>
  // ----------------------------------------------------------------
  // Sustituye esta URL por la de tu propio repositorio de GitHub una
  // vez lo hayas creado y el Action haya corrido al menos una vez:
  //   https://raw.githubusercontent.com/ignaciozaballos/clasificacion-golf/main/data/latest.json
  // ----------------------------------------------------------------
  const CONFIG = {
    DATA_URL: "https://raw.githubusercontent.com/ignaciozaballos/clasificacion-golf/main/data/latest.json",
    // Si quieres resaltar tu propia fila, pon aquí tu "id" de friends.json
    YOU_ID: "ignacio"
  };

  const board = document.getElementById('board');
  const updatedEl = document.getElementById('updated');
  const stateArea = document.getElementById('state-area');

  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function fmtDaysAgo(iso) {
    if (!iso) return '—';
    const then = new Date(iso + 'T00:00:00');
    const now = new Date();
    const days = Math.max(0, Math.floor((now - then) / (1000 * 60 * 60 * 24)));
    if (days === 0) return 'Hoy';
    if (days === 1) return 'Ayer';
    return `Hace ${days} d.`;
  }

  function fmtTimestamp(iso) {
    if (!iso) return '';
    const dt = new Date(iso);
    return dt.toLocaleString('es-ES', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function trendPill(trend) {
    if (trend === 'up') return { cls: 'up', glyph: '▲' };
    if (trend === 'down') return { cls: 'down', glyph: '▼' };
    if (trend === 'new') return { cls: 'new', glyph: '•' };
    return { cls: 'same', glyph: '=' };
  }

  function render(snapshot) {
    updatedEl.textContent = 'Actualizado ' + fmtTimestamp(snapshot.generated_at);
    board.innerHTML = '';

    const players = snapshot.players || [];
    if (players.length === 0) {
      stateArea.innerHTML = '<div class="state">Todavía no hay datos. En cuanto el Action se ejecute por primera vez aparecerán aquí.</div>';
      return;
    }
    stateArea.innerHTML = '';

    for (const p of players) {
      const li = document.createElement('li');
      const rankClass = (p.rank && p.rank <= 5) ? ` rank-${p.rank}` : '';
      li.className = 'row' + rankClass + (p.id === CONFIG.YOU_ID ? ' you' : '');

      const errorNote = p.error
        ? `<div class="status-line" style="color: var(--down);">${p.error}</div>`
        : (p.estado && p.estado.toLowerCase() !== 'válido'
            ? `<div class="status-line">${p.estado}</div>`
            : '');

      const t = trendPill(p.trend);

      li.innerHTML = `
        <div class="rank">${p.rank ?? '–'}</div>
        <div>
          <div class="name">${p.nombre ?? '(sin datos)'}</div>
          ${errorNote}
        </div>
        <div class="licencia">${p.licencia ?? '—'}</div>
        <div class="handicap">${p.handicap_display ?? '—'}</div>
        <div class="trend"><span class="pill ${t.cls}" title="${p.trend}">${t.glyph}</span></div>
        <div class="mod" title="${fmtDate(p.ultima_modificacion)}">${fmtDaysAgo(p.ultima_modificacion)}</div>
      `;
      board.appendChild(li);
    }
  }

  async function load() {
    try {
      const res = await fetch(CONFIG.DATA_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const snapshot = await res.json();
      render(snapshot);
    } catch (err) {
      updatedEl.textContent = '';
      stateArea.innerHTML = `<div class="error-box">
        No se pudo cargar el ranking (${err.message}).<br>
        Comprueba que CONFIG.DATA_URL apunta a tu archivo data/latest.json en GitHub
        y que el repositorio es público.
      </div>`;
    }
  }

  load();
</script>
</body>
</html>
